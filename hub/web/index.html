<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>G3 Hub</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

  <aside class="sidebar glass" id="sidebar">
    <a class="brand" href="#/">
      <img src="icon.svg" alt="" width="40" height="40">
      <span><b id="brand-name">G3 Hub</b><small id="brand-sub">IPTV for the launcher</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <main class="main" id="main" tabindex="-1"></main>

  <div class="toast glass" id="toast" role="status" aria-live="polite"></div>
  <div id="layers"></div>

  <script src="i18n.js"></script>
  <script src="i18n/en.js"></script>
  <script src="i18n/sv.js"></script>
  <script src="app.js"></script>
</body>
</html>
